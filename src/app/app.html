<div class="product-grid">
  @for (product of products; track product.id) {
    <div class="product-card">
      <img [src]="product.image" [alt]="product.title" class="product-card__image">
      
      <div class="card__content">
        <h3 class="card__title">{{ product.title.slice(0,40)}}...</h3>
        <p class="card__category">{{ product.category }}</p>
        <p class="card__price">Price: {{ product.price }}</p>
        
        <div class="card__rating">
          <p class="card__rating-item">⭐️: {{ product.rating.rate }}</p>
          <p class="card__rating-item">Count: {{ product.rating.count }}</p>
        </div>
        
        <button class="card__button" type="button">See all</button>
      </div>
    </div>
  }
</div>
